workflows:
  ios-simulator:
    name: Tend iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: ios-app

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml

      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project Tend.xcodeproj \
            -scheme Tend \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/derived-data" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Launch app in cloud simulator
        script: |
          # Tend has no backend and no login (see docs/MVP_SCOPE.md), so
          # unlike myemptycloset/Car Hopping there's nothing to pre-warm
          # and no autologin result to poll for — just wait for the app's
          # own launch marker before screenshotting.
          DEVICE_ID=$(xcrun simctl list devices available -j | \
            ruby -rjson -e '
              data = JSON.parse(STDIN.read)
              devices = data["devices"].values.flatten
              iphone = devices.find { |d| d["name"].start_with?("iPhone") && d["isAvailable"] }
              abort "No available iPhone simulator found" unless iphone
              puts iphone["udid"]
            ')

          echo "Using simulator: $DEVICE_ID"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

          # bootstatus returns as soon as the device reports "Booted", but
          # SpringBoard itself can still take a few more seconds to
          # actually become interactive.
          sleep 5

          APP_PATH="$CM_BUILD_DIR/derived-data/Build/Products/Debug-iphonesimulator/Tend.app"

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          mkdir -p "$CM_BUILD_DIR/simulator-artifacts"

          # One launch per tab (or non-tab "deep screen"), for App Store
          # review screenshots. Data seeded on the first (Home) launch
          # persists in the app's Documents dir across the later
          # relaunches on the same simulator/install, so nothing else
          # needs to re-seed. SIMCTL_CHILD_IOS_TEST_SKIP_FACEID is set
          # unconditionally on every launch, tab or deep-screen alike —
          # an unhandled Face ID prompt on this unattended simulator
          # would hang the whole workflow until timeout, not just fail
          # one screenshot, so this can't be limited to just Journal's
          # capture call.
          await_launch_and_screenshot() {
            local screenshot_name="$1"
            local LOGFILE="$CM_BUILD_DIR/simulator-artifacts/app-console-${screenshot_name}.log"
            local launch_pid=$!

            local waited=0
            until grep -q "IOS_TEST_APP_LAUNCHED" "$LOGFILE" 2>/dev/null; do
              sleep 1
              waited=$((waited + 1))
              if [ "$waited" -ge 45 ]; then
                echo "Timed out waiting for IOS_TEST_APP_LAUNCHED after ${waited}s ($screenshot_name)"
                break
              fi
            done

            # Let the tab-switch/render settle before capturing.
            sleep 2

            xcrun simctl io "$DEVICE_ID" screenshot \
              "$CM_BUILD_DIR/simulator-artifacts/${screenshot_name}.png"

            kill "$launch_pid" 2>/dev/null || true
            xcrun simctl terminate "$DEVICE_ID" com.tendyourself.app 2>/dev/null || true
            echo "--- app console log ($screenshot_name) ---"
            cat "$LOGFILE" || true
          }

          capture_tab() {
            local tab_index="$1"
            local screenshot_name="$2"
            local seed="$3"
            local LOGFILE="$CM_BUILD_DIR/simulator-artifacts/app-console-${screenshot_name}.log"

            SIMCTL_CHILD_IOS_TEST_AUTOMATION="1" \
              SIMCTL_CHILD_IOS_TEST_SKIP_FACEID="1" \
              SIMCTL_CHILD_IOS_TEST_INITIAL_TAB="$tab_index" \
              SIMCTL_CHILD_IOS_TEST_SEED_DATA="$seed" \
              xcrun simctl launch --console-pty "$DEVICE_ID" com.tendyourself.app \
                > "$LOGFILE" 2>&1 &

            await_launch_and_screenshot "$screenshot_name"
          }

          capture_deep_screen() {
            local screen_name="$1"
            local screenshot_name="$2"
            local LOGFILE="$CM_BUILD_DIR/simulator-artifacts/app-console-${screenshot_name}.log"

            SIMCTL_CHILD_IOS_TEST_AUTOMATION="1" \
              SIMCTL_CHILD_IOS_TEST_SKIP_FACEID="1" \
              SIMCTL_CHILD_IOS_TEST_DEEP_SCREEN="$screen_name" \
              SIMCTL_CHILD_IOS_TEST_SEED_DATA="0" \
              xcrun simctl launch --console-pty "$DEVICE_ID" com.tendyourself.app \
                > "$LOGFILE" 2>&1 &

            await_launch_and_screenshot "$screenshot_name"
          }

          capture_tab 0 tend-home 1
          capture_tab 1 tend-meditate 0
          capture_tab 2 tend-tasks 0
          capture_tab 3 tend-journal 0
          capture_tab 4 tend-you 0

          capture_deep_screen medication tend-medication
          capture_deep_screen resources tend-resources
          capture_deep_screen water tend-water
          capture_deep_screen garden tend-garden
          capture_deep_screen hardDayMode tend-harddaymode

    artifacts:
      - $CM_BUILD_DIR/derived-data/Build/Products/Debug-iphonesimulator/Tend.app
      - $CM_BUILD_DIR/simulator-artifacts/**
      - /tmp/xcodebuild_logs/*.log

  # Builds a completely unsigned .ipa for a real iPhone, for local
  # sideloading via Sideloadly rather than TestFlight — no paid Apple
  # Developer Program membership required.
  ios-device-unsigned:
    name: Tend Device (unsigned, for sideloading)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: ios-app

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml

      - name: Build for iOS device (unsigned)
        script: |
          xcodebuild build \
            -project Tend.xcodeproj \
            -scheme Tend \
            -sdk iphoneos \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/derived-data" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned .ipa
        script: |
          APP_PATH="$CM_BUILD_DIR/derived-data/Build/Products/Debug-iphoneos/Tend.app"
          PAYLOAD_DIR="$CM_BUILD_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd "$CM_BUILD_DIR"
          zip -r Tend-unsigned.ipa Payload

    artifacts:
      - $CM_BUILD_DIR/Tend-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  # Signed build for TestFlight / App Store Connect, using the
  # myemptycloset-appstore Apple Developer Portal integration (same Apple
  # Developer account/Team ID covers every app on this account — the
  # integration name is historical, not app-specific) configured in
  # Codemagic team settings.
  ios-appstore:
    name: Tend App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: ios-app

    integrations:
      app_store_connect: myemptycloset-appstore

    environment:
      vars:
        BUNDLE_ID: com.tendyourself.app
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml

      - name: Locate App Store Connect auth key
        script: |
          # Bypass Codemagic's manual signing pipeline entirely
          # (fetch-signing-files / keychain add-certificates /
          # use-profiles) -- on myemptycloset/Car Hopping's identical
          # setup, the certificate's .p12 consistently failed
          # "SecKeychainItemImport: Unable to decode the provided data"
          # on import regardless of which openssl produced it, most
          # likely because codemagic-cli-tools builds it via Python's
          # cryptography library rather than shelling out to openssl at
          # all.
          #
          # Instead, hand the App Store Connect API key straight to
          # xcodebuild itself via -authenticationKey* flags (Apple's own
          # supported CI signing path): Xcode talks to App Store Connect
          # directly to fetch/create whatever certificate and
          # provisioning profile it needs at archive/export time, with no
          # local keychain or .p12 involved.
          #
          # $APP_STORE_CONNECT_PRIVATE_KEY is NOT the raw PEM content --
          # Codemagic exposes it as an "@file:<path>" reference to a .p8
          # it already wrote to disk. Strip the prefix to get the real
          # path.
          echo "AUTH_KEY_PATH=${APP_STORE_CONNECT_PRIVATE_KEY#@file:}" >> $CM_ENV

      - name: Increment build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Revoke stale Development certificates
        script: |
          # Automatic signing (-allowProvisioningUpdates below) creates an
          # "Apple Development" certificate as a side effect of archiving,
          # even though only Distribution matters for this workflow.
          # Every CI run gets a brand-new, empty keychain, so the *next*
          # run never has that certificate's private key locally and
          # can't reuse it -- Xcode then refuses to proceed with "Your
          # account already has an Apple Development signing certificate
          # for this machine, but its private key is not installed in
          # your keychain," since silently revoking a certificate isn't
          # something -allowProvisioningUpdates does on its own. Revoking
          # any existing Development-type certs before every archive
          # keeps this self-healing instead of requiring a manual trip to
          # the Apple Developer portal each time this happens.
          CERT_IDS=$(app-store-connect certificates list \
            --type DEVELOPMENT IOS_DEVELOPMENT \
            --json | python3 -c "import sys, json; print('\n'.join(c['id'] for c in json.load(sys.stdin)))")

          for CERT_ID in $CERT_IDS; do
            echo "Revoking stale Development certificate $CERT_ID"
            app-store-connect certificates delete "$CERT_ID" --ignore-not-found
          done

      - name: Archive
        script: |
          xcodebuild \
            -project Tend.xcodeproj \
            -scheme Tend-Release \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/Tend.xcarchive" \
            -destination 'generic/platform=iOS' \
            archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Export ipa
        script: |
          cat > "$CM_BUILD_DIR/ExportOptions.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>4357L599UW</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/Tend.xcarchive" \
            -exportPath "$CM_BUILD_DIR/build/ipa" \
            -exportOptionsPlist "$CM_BUILD_DIR/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - $CM_BUILD_DIR/build/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Was true, but auto-submitting to *external* TestFlight beta
        # review needs Beta App Review contact info (name/phone/email)
        # that's never been filled in — every build's post-processing
        # step failed on that alone, even though the build itself
        # uploaded and processed fine and was already usable/attachable
        # to an App Store version submission without it. That's the only
        # thing this project actually needs from this publishing step.
        submit_to_testflight: false
  macos-appstore:
    name: Tend macOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: ios-app
    integrations:
      app_store_connect: myemptycloset-appstore

    environment:
      groups:
        - macos
      vars:
        BUNDLE_ID: com.tendyourself.app
      xcode: latest

    scripts:  
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml
      - name: Locate App Store Connect key
        script: |
          echo "AUTH_KEY_PATH=${APP_STORE_CONNECT_PRIVATE_KEY#@file:}" >> $CM_ENV
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch Mac signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform MAC_OS \
            --type MAC_APP_STORE \
            --create
      
      - name: Fetch Mac Installer Distribution certificate
        script: |
          app-store-connect certificates list --type MAC_APP_DISTRIBUTION --save
      - name: Install signing certificates
        script: |
          keychain add-certificates
      - name: Apply provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Archive macOS app
        script: |
          xcodebuild archive \
            -project Tend.xcodeproj \
            -scheme TendMac-Release \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath build/TendMac.xcarchive \
            -allowProvisioningUpdates
      - name: Export macOS app
        script: |
          cat > /tmp/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tendyourself.app</key>
              <string>Tend Yourself mac_app_store 1789508411</string>
            </dict>
            <key>teamID</key>
            <string>4357L599UW</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/TendMac.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates
            -archivePath build/TendMac.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates
    artifacts:
      - build/export/*.pkg
      - build/export/*.app
      - build/TendMac.xcarchive
