name: Tend

options:
  minimumXcodeGenVersion: 2.38.0

settings:
  base:
    PRODUCT_NAME: Tend
    PRODUCT_BUNDLE_IDENTIFIER: com.tendyourself.app
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    # iPhone only ("1"): the UI is portrait-only and not designed for
    # iPad/landscape, so we don't declare iPad support at all rather
    # than adding orientation support the app doesn't have.
    TARGETED_DEVICE_FAMILY: "1"
    # Automatic + DEVELOPMENT_TEAM, paired with xcodebuild's own
    # -allowProvisioningUpdates/-authenticationKey* flags in the
    # ios-appstore workflow: Xcode talks to App Store Connect directly
    # with the API key to fetch/create whatever cert+profile it needs at
    # archive time, with no local keychain/.p12 juggling at all. (Manual
    # signing via Codemagic's fetch-signing-files/keychain
    # add-certificates/use-profiles pipeline hit a wall on myemptycloset's
    # identical setup: the certificate's .p12 consistently failed
    # "SecKeychainItemImport: Unable to decode the provided data" on
    # import regardless of which openssl produced it.)
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4357L599UW
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

configs:
  Debug: debug
  Release: release

targets:
  Tend:
    type: application
    platform: iOS
    sources:
      - path: Tend
    settings:
      base:
        PRODUCT_NAME: Tend
        PRODUCT_BUNDLE_IDENTIFIER: com.tendyourself.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Tend/App/Info.plist
      # No per-config CODE_SIGNING_ALLOWED/CODE_SIGN_IDENTITY overrides
      # here — on myemptycloset's identical setup these caused
      # GatherProvisioningInputs to see conflicting/incomplete signing
      # requirements across the scheme's actions during `xcodebuild
      # archive -allowProvisioningUpdates`. The ios-simulator and
      # ios-device-unsigned workflows already force-disable signing via
      # their own explicit xcodebuild command-line flags
      # (CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
      # CODE_SIGNING_ALLOWED=NO), so no project-level Debug override is
      # needed for them to keep working.

  TendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TendTests
    dependencies:
      - target: Tend
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tend.app/Tend"

schemes:
  # Default scheme (unchanged in spirit) — used by ios-simulator and
  # ios-device-unsigned, which build via `xcodebuild build` and override
  # signing on the command line regardless of what's configured here.
  Tend:
    build:
      targets:
        Tend: [run, test, profile, analyze, archive]
    run:
      config: Debug
    archive:
      config: Release
  # Archive-only scheme for the ios-appstore workflow. GatherProvisioningInputs
  # validates signing for every action present in a scheme — including
  # Run/Test/Profile, which conventionally need a Development
  # certificate — not just the action actually being invoked. A scheme
  # containing only the archive action has nothing else for
  # GatherProvisioningInputs to resolve. (Same pattern as
  # myemptycloset's ios-app/project.yml.)
  Tend-Release:
    build:
      targets:
        Tend: [archive]
    archive:
      config: Release
